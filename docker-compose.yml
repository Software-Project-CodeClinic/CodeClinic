services:
  spring-gateway:
    build: ./backend
    ports:
      # Windows Hyper-V가 8080을 예약하므로 호스트 포트는 8181 사용
      # 접속: http://localhost:8181/api/dashboard
      - "8181:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      fastapi:
        condition: service_started
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-waf}
      DB_USER: ${POSTGRES_USER:-waf}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-waf_local_secret}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://fastapi:8000}
      SEMGREP_CMD: semgrep
      SPRING_PROFILES_ACTIVE: demo
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  fastapi:
    build: ./ai-server
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waf}
      POSTGRES_USER: ${POSTGRES_USER:-waf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waf_local_secret}
    volumes:
      # TimescaleDB 데이터 영속화
      - tsdb_data:/var/lib/postgresql/data
      # 최초 기동 시 자동 실행되는 초기화 SQL (hypertable, 인덱스 생성)
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waf} -d ${POSTGRES_DB:-waf}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Week 2 이후 사용 예정 (세션 캐시 등). 미리 구성해 둠
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  tsdb_data:
